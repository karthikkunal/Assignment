name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate
        shell: pwsh
        run: .\scripts\setup.ps1 -PythonExecutable python -GoExecutable go

      - name: Upload agent package
        uses: actions/upload-artifact@v4
        with:
          name: quantumgenie-agent-windows-amd64
          path: agent/dist/quantumgenie-agent-windows-amd64.zip
          if-no-files-found: error